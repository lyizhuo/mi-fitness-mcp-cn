name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-arm64:
    name: smoke (linux/arm64)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull arm64 image
        run: |
          ref="${{ env.IMAGE }}@${{ needs.build.outputs.digest }}"
          docker pull --platform linux/arm64 "$ref"

      - name: Verify architecture and CLI
        run: |
          ref="${{ env.IMAGE }}@${{ needs.build.outputs.digest }}"
          arch=$(docker run --rm --platform linux/arm64 "$ref" uname -m)
          echo "container arch: $arch"
          [ "$arch" = "aarch64" ] || { echo "::error::expected aarch64, got $arch"; exit 1; }
          docker run --rm --platform linux/arm64 "$ref" --help >/dev/null
          docker run --rm --platform linux/arm64 "$ref" \
            python -c 'import mi_fitness_mcp, fastapi, flask, keyring, keyrings.alt; print("imports ok")'

      - name: Run API + dashboard (all mode)
        run: |
          ref="${{ env.IMAGE }}@${{ needs.build.outputs.digest }}"
          docker run -d --name mifitness-smoke --platform linux/arm64 \
            -p 18321:8321 -p 18322:8322 "$ref"
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18321/ >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:18322/api/proxy_status >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::container did not become ready"
            docker logs --tail 100 mifitness-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:18321/ | grep -q mi-fitness-api
          curl -fsS http://127.0.0.1:18322/api/proxy_status | grep -q '"backend_reachable":true'
          docker stop mifitness-smoke

      - name: Container logs
        if: always()
        run: docker logs --tail 100 mifitness-smoke || true
